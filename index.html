<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#9F133A" />
    <title>FemPowHer — Global Reproductive Care & Safe Haven Map</title>
    <link rel="manifest" href="./manifest.json" />
    <!-- Fallback fonts for non-Latin scripts (Dari/Arabic, Hindi/Devanagari, Hanifi Rohingya & Bengali) after Kefa -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&family=Noto+Sans+Bengali:wght@500;700;800&family=Noto+Sans+Hanifi+Rohingya:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet Interactive Map CSS & JS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- Tailwind CSS with custom FemPowHer palette & Kefa font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              crimson: '#9F133A',
              raspberry: '#CF366C',
              lightpink: '#FEACEC'
            },
            fontFamily: {
              kefa: ['Kefa', 'Noto Naskh Arabic', 'Noto Serif Devanagari', 'Noto Sans Bengali', 'Noto Sans Hanifi Rohingya', 'Georgia', 'serif']
            }
          }
        }
      };
    </script>
    <style>
      * {
        font-family: 'Kefa', 'Noto Naskh Arabic', 'Noto Serif Devanagari', 'Noto Sans Bengali', 'Noto Sans Hanifi Rohingya', Georgia, serif !important;
      }
      body {
        font-family: 'Kefa', 'Noto Naskh Arabic', 'Noto Serif Devanagari', 'Noto Sans Bengali', 'Noto Sans Hanifi Rohingya', Georgia, serif !important;
        margin: 0;
        padding: 0;
        background-color: #9F133A;
      }
      .leaflet-container {
        font-family: 'Kefa', 'Noto Naskh Arabic', 'Noto Serif Devanagari', 'Noto Sans Bengali', 'Noto Sans Hanifi Rohingya', Georgia, serif !important;
      }

      /* Train Info Sign Marquee Animations */
      @keyframes marqueeLeft {
        0% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      @keyframes marqueeRight {
        0% {
          transform: translateX(-50%);
        }
        100% {
          transform: translateX(0%);
        }
      }
      .train-ticker-left {
        display: flex;
        width: max-content;
        animation: marqueeLeft 42s linear infinite;
      }
      .train-ticker-right {
        display: flex;
        width: max-content;
        animation: marqueeRight 46s linear infinite;
      }
      .train-ticker-fast {
        display: flex;
        width: max-content;
        animation: marqueeLeft 34s linear infinite;
      }
      .train-ticker-left:hover,
      .train-ticker-right:hover,
      .train-ticker-fast:hover {
        animation-play-state: paused;
      }

      .fempowher-map-pin {
        background: transparent !important;
        border: none !important;
      }
      .fempowher-map-pin-inner {
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
        transform-origin: center center;
      }
      .fempowher-map-pin:hover .fempowher-map-pin-inner {
        transform: scale(1.85);
        filter: drop-shadow(0 3px 6px rgba(159, 19, 58, 0.55)) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Clear any old service worker caches so latest pages always show immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
      }
      if ('caches' in window) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
      }

      import React from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import App from './src/App.js?v=278';

      const root = createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
